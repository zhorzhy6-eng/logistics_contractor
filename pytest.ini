[pytest]
testpaths = tests
addopts = -q
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Медленные тесты: поднимают реальные модели Natasha (core/pseudonymizer.py).
; Быстрый прогон без них: pytest -m "not slow"
; needs_db / needs_qt — маркеры СЛОЁВ (Этап 7). Отдельные тесты ими пока не
; помечены: слой задаётся папкой (tests/integration/, tests/ui/), а маркеры
; объявлены, чтобы pytest не ругался на них в сторонних наборах и чтобы
; можно было помечать точечно.
markers =
    slow: тест поднимает реальные модели Natasha
    needs_private: тест требует приватной части проекта (клиентские типы договоров)
    needs_db: тест требует SQLite (слой tests/integration)
    needs_qt: тест требует QApplication (слой tests/ui)
; Рабочая папка тестов и эталоны: не собирать их содержимое как тесты.
; private/ — приватная часть проекта: её тесты запускаются из своей папки
; (у неё свой conftest), в публичном прогоне они не собираются никогда.
norecursedirs = _tmp __pycache__ .git private data
