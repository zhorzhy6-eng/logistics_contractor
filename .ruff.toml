# Линтер ruff. Начинаем с МИНИМАЛЬНЫХ правил — критичных для кода.
# Остальное включим по мере рефакторинга.
#
# Почему так мало правил: при включении настроек по умолчанию (ruff 0.16.8)
# на проекте находится 4643 замечания — почти все стилистические. Чинить их
# одним заходом нельзя: Этап 8 — обвязка, код приложения не меняется.
# Поэтому включены только два набора, которые ловят НАСТОЯЩИЕ ошибки:
#   F  — pyflakes: неиспользуемые импорты и переменные, неопределённые имена;
#   E9 — pycodestyle: синтаксические ошибки (E901, E902, E999).
# Остальное (I, UP, B, C4, SIM, PERF, DTZ, RET, …) — по мере рефакторинга.
#
# Файл читается ruff'ом автоматически: `.ruff.toml` в корне проекта.
# В pyproject.toml настроек ruff НЕТ намеренно — чтобы не было двух
# источников правды.

line-length = 100
target-version = "py314"

[lint]
select = [
    "F",    # pyflakes: неиспользуемые импорты, переменные
    "E9",   # pycodestyle: синтаксические ошибки
]
ignore = [
    "E501",  # line too long — не критично сейчас
    # F401 («imported but unused») НЕ игнорируется глобально: настоящие
    # неиспользуемые импорты почищены в 1.F (`ruff check --select F --fix`).
    # Исключения — только для файлов, где импорт и есть смысл файла
    # (shim-файлы обратной совместимости), см. per-file-ignores.
    #
    # F821 («undefined name») НЕ игнорируется глобально: одно настоящее
    # срабатывание починено. Четыре оставшихся — ЛОЖНЫЕ, и они закрыты
    # точечно (per-file-ignores с объяснением), а не выключением правила.
]

[lint.per-file-ignores]
# Тесты: неиспользуемые импорты встречаются в фикстурах и в пробах «а что
# если импортировать так». Сами тесты почищены, здесь — страховка.
"tests/**" = ["F401"]

# Shim-файлы обратной совместимости: ВЕСЬ смысл этих файлов — реэкспорт
# прежних имён (см. `register_module_alias`, Этапы 1–6). Убрать импорт
# значит сломать старые пути импорта, на которых стоит приватная часть.
"core/agent/__init__.py" = ["F401", "F403"]
"core/contracts/base/__init__.py" = ["F401", "F403"]
"ui/main_window/__init__.py" = ["F401", "F811"]
"core/__init__.py" = ["F401"]
# `ui/widgets/__init__.py` — тоже пакет-вход (ШАГ FIX-5): имена виджетов
# реэкспортируются из него, поэтому `from ui.widgets import …` работает
# у 20+ модулей. Часть импортов в нём — только ради этих имён
# (`Callable`, `QSizePolicy`, `Qt` тексту не нужны, но раньше были видны
# снаружи как атрибуты пакета). Убирать их — менять публичную поверхность.
"ui/widgets/__init__.py" = ["F401"]

# Ложные F821 — там, где имя появляется ЛЕНИВО, через модульный
# `__getattr__` (разрыв цикла импорта, Этапы 2 и 4), и ruff этого не видит:
#   * `services/recognition/import_service.py` — `read_document` и
#     `DataMapper` резолвятся при первом обращении (иначе цикл
#     `reader → core/__init__ → import_service → reader`);
#   * `core/mirror.py` — `TARGET_PROFILES` приходит из приватного соседа
#     `core/mirror_targets.py` после `attach_private_root()`;
#   * `core/contracts/base/postprocess.py` — тип `BaseContractGenerator`
#     назван СТРОКОЙ в аннотации (так разорван цикл
#     `generator → postprocess → generator`), импортировать его нельзя.
"services/recognition/import_service.py" = ["F821"]
"core/mirror.py" = ["F821"]
"core/contracts/base/postprocess.py" = ["F821"]

# Инструменты разработки и одноразовые скрипты: неиспользуемые импорты и
# переменные здесь не редкость (заготовки, ручные пробы).
"tools/**" = ["F401", "F841"]
