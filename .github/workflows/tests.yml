# CI: прогон тестов по слоям на каждый push в main и на pull request.
#
# Почему по слоям, а не одним процессом: на машине оператора полный набор в
# одном процессе роняет pytest с 0xC0000409 (свойство окружения — PyQt5 на
# Python 3.14). После Этапа 7 слои запускаются раздельно и не требуют деления
# на части: `tests/ui/` (1687 тестов) проходит одним процессом.
#
# python-version: 3.14 доступен в actions/python-versions (есть 3.14.4 и
# новее для win32-x64), поэтому стоит 3.14. Если когда-нибудь станет
# недоступен — замена одна строка: '3.12' (проект совместим).
#
# ─────────────────────────────────────────────────────────────
# ИЗВЕСТНЫЕ ОТКАЗЫ: почему CI красный, и что с этим делать
# ─────────────────────────────────────────────────────────────
# В наборе есть 10 отказов, которые НЕ являются регрессом: они
# воспроизводятся на коде ДО рефакторинга (проверено worktree на `0b4ccde`).
# Разбор каждого — в `docs/STATE.md`, «Известные расхождения».
# Чинить их — отдельная задача (в «Следующем шаге» она стоит пунктом 6),
# и этот этап их НЕ трогает: Этап 8 — обвязка.
#
# Поэтому прогон устроен так: **тесты идут ВСЕ**, а известные отказы
# названы поимённо. Список лежит ФАЙЛОМ — `.ci/known_failures.txt`
# (в нём же объяснение по каждой группе). Файл, а не строка в YAML,
# потому что в ID теста есть кириллица и квадратные скобки, и разбор
# строки на аргументы ломается на пробелах внутри ID.
#
# Читается так: одна строка файла = один аргумент командной строки;
# строки с `#` и пустые пропускаются.
#
# КОГДА ЭТИ ОТКАЗЫ ПОЧИНЯТ — `.ci/known_failures.txt` удаляется целиком,
# вместе со ссылками на него здесь.
#
# Что НЕ делается в CI:
#   * приватная часть (`logistics_contractor_private`) — отдельный
#     репозиторий, в публичном CI её нет; тесты с маркером `needs_private`
#     в этих слоях не собираются;
#   * Tesseract OCR не ставится: тесты офлайн-OCR при его отсутствии
#     пропускаются (`skip`), а не падают;
#   * `config/settings.json` не создаётся: файл локальный (у каждого
#     оператора свой) и в репозитории его нет намеренно — есть
#     `settings.example.json`. Два теста, которые читают РАБОЧИЙ файл,
#     перечислены в `.ci/known_failures.txt`;
#   * два теста сверки с рабочей `contracts.db` в CI не падают, а
#     пропускаются: в свежем checkout базы оператора нет.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        shell: pwsh
        run: |
          $skip = @(Get-Content .ci/known_failures.txt -Encoding utf8 |
                    Where-Object { $_.Trim() -ne "" -and -not $_.TrimStart().StartsWith("#") } |
                    ForEach-Object { $_.Trim() })
          python -m pytest tests/unit/ -o addopts="" -q --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-unit.xml @skip
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      # Отчёт печатается В ЛОГ, а не только кладётся артефактом: артефакт
      # доступен лишь владельцу репозитория, а лог читается и без входа.
      - name: Show failures
        if: always()
        shell: pwsh
        run: |
          $file = "tests/_tmp/junit-unit.xml"
          if (-not (Test-Path $file)) { Write-Output "отчёта нет"; exit 0 }
          [xml]$x = Get-Content $file -Encoding utf8
          $fail = $x.testsuites.testsuite | ForEach-Object { $_.testcase } |
                  Where-Object { $_.failure -or $_.error }
          Write-Output "ОТКАЗОВ В СЛОЕ unit: $(@($fail).Count)"
          $fail | ForEach-Object {
            Write-Output "  FAIL: $($_.classname)::$($_.name)"
            Write-Output "        $(($_.failure.message -split "`n")[0])"
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: tests/_tmp/junit-unit.xml
          if-no-files-found: ignore

  test-integration:
    name: Integration tests
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          $skip = @(Get-Content .ci/known_failures.txt -Encoding utf8 |
                    Where-Object { $_.Trim() -ne "" -and -not $_.TrimStart().StartsWith("#") } |
                    ForEach-Object { $_.Trim() })
          python -m pytest tests/integration/ -o addopts="" -q --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-integration.xml @skip
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: tests/_tmp/junit-integration.xml
          if-no-files-found: ignore

  test-ui:
    name: UI tests (offscreen)
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $skip = @(Get-Content .ci/known_failures.txt -Encoding utf8 |
                    Where-Object { $_.Trim() -ne "" -and -not $_.TrimStart().StartsWith("#") } |
                    ForEach-Object { $_.Trim() })
          python -m pytest tests/ui/ -o addopts="" -q --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-ui.xml @skip
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui
          path: tests/_tmp/junit-ui.xml
          if-no-files-found: ignore

  lint:
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .


