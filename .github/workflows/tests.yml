# CI: прогон тестов по слоям на каждый push в main и на pull request.
#
# Почему по слоям, а не одним процессом: на машине оператора полный набор в
# одном процессе роняет pytest с 0xC0000409 (свойство окружения — PyQt5 на
# Python 3.14). После Этапа 7 слои запускаются раздельно и не требуют деления
# на части: `tests/ui/` (1687 тестов) проходит одним процессом.
#
# python-version: стоит ТОЧНАЯ версия 3.14.4 — та же, что на рабочей машине
# оператора, а не «последняя 3.14.x». Причина измеренная: на раннере с
# 3.14.8 UI-слой ронял процесс НАТИВНО (0xC0000409: junit пустой, сводки
# нет) ровно на тестах, которые строят главное окно с потоком агента и
# закрывают его, — на 3.14.4 те же тесты проходят. Это свойство связки
# CPython + PyQt5 5.15.11, а не код проекта: чинить его из тестов нечем.
# Если 3.14.4 станет недоступен — замена одна строка: '3.14' или '3.12'.
#
# Слои идут ВСЕ и целиком: список «известных отказов» (`.ci/known_failures.txt`)
# больше не нужен — оба оставшихся теста читали РАБОЧИЙ `config/settings.json`
# и теперь честно пропускаются, когда файла нет (он локальный, у каждого
# оператора свой; в репозитории лежит только образец `settings.example.json`).
# Файл удалён вместе со ссылками на него здесь — как и было записано в его
# шапке.
#
# ─────────────────────────────────────────────────────────────
# ПОЧЕМУ ОТКАЗЫ ПЕЧАТАЮТСЯ АННОТАЦИЯМИ (шаг «Publish failures»)
# ─────────────────────────────────────────────────────────────
# Логи GitHub Actions отдаёт ТОЛЬКО владельцу репозитория: `/actions/jobs/
# <id>/logs` отвечает 403 без входа, артефакты — 401. А вот аннотации
# check-run читаются публично:
#     https://api.github.com/repos/<owner>/<repo>/check-runs/<job_id>/annotations
# Поэтому имена упавших тестов, итоговая строка pytest и размер отчёта
# печатаются workflow-командами `::error::` (`.ci/publish_failures.ps1`) —
# GitHub превращает их в аннотации. Шаг выполняется ВСЕГДА (`if: always()`)
# и никогда не роняет работу.
#
# Что НЕ делается в CI:
#   * приватная часть (`logistics_contractor_private`) — отдельный
#     репозиторий, в публичном CI её нет; тесты с маркером `needs_private`
#     в этих слоях не собираются;
#   * Tesseract OCR не ставится: тесты офлайн-OCR при его отсутствии
#     пропускаются (`skip`), а не падают;
#   * `config/settings.json` не создаётся: файл локальный и в репозитории
#     его нет намеренно — есть `settings.example.json`. Тесты, которые
#     читают рабочий файл, пропускаются по `skipif`;
#   * два теста сверки с рабочей `contracts.db` в CI не падают, а
#     пропускаются: в свежем checkout базы оператора нет.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  #: Qt без экрана: UI-тесты идут в offscreen-режиме во всех слоях.
  QT_QPA_PLATFORM: offscreen

jobs:
  test-unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/_tmp | Out-Null
          python -m pytest tests/unit/ -o addopts="" -q -rf --tb=line --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-unit.xml 2>&1 |
            Tee-Object -FilePath tests/_tmp/unit-output.txt
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          . ./.ci/publish_failures.ps1 -Layer unit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: tests/_tmp/junit-unit.xml
          if-no-files-found: ignore

  test-integration:
    name: Integration tests
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/_tmp | Out-Null
          python -m pytest tests/integration/ -o addopts="" -q -rf --tb=line --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-integration.xml 2>&1 |
            Tee-Object -FilePath tests/_tmp/integration-output.txt
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          . ./.ci/publish_failures.ps1 -Layer integration

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: tests/_tmp/junit-integration.xml
          if-no-files-found: ignore

  test-ui:
    name: UI tests (offscreen)
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        shell: pwsh
        run: |
          # `tests/_tmp` создаётся ЗАРАНЕЕ: иначе `Tee-Object` не может открыть
          # файл, конвейер рвётся, и pytest падает «internal error» на записи
          # в закрытый stdout — именно это случилось в прогоне №14.
          New-Item -ItemType Directory -Force -Path tests/_tmp | Out-Null
          # UI-слой идёт ЧАСТЯМИ, по папкам. Локально он проходит одним
          # процессом (16 минут), а на раннере GitHub процесс обрывался
          # нативно (0xC0000409) после ~390 тестов — ровно там, где впервые
          # строится настоящее окно MainWindow (junit пустой, сводки нет).
          # Это та же болезнь окружения, из-за которой в проекте не гоняют
          # весь набор одним процессом; лечение то же — своя часть, свой
          # процесс, свой `--basetemp`. Плюс `-v`: если часть всё-таки
          # оборвётся, в хвосте вывода видно, НА КАКОМ тесте.
          # Части по папкам, а `main_window` — ещё на две по файлам: именно
          # он обрывался нативно. Разделение по файлам заодно проверяет
          # догадку «обрыв связан с тестами, которые шли ПЕРЕД ним»
          # (`test_qt_crash_handler.py` запускает `main.py` подпроцессом).
          $parts = [ordered]@{
            'agent_widget'  = @('tests/ui/agent_widget')
            'main_window_a' = @('tests/ui/main_window/test_action_logging.py',
                                'tests/ui/main_window/test_main_window_selector.py',
                                'tests/ui/main_window/test_qt_crash_handler.py')
            'main_window_b' = @('tests/ui/main_window/test_qt_shutdown_agent_pool.py',
                                'tests/ui/main_window/test_ui_floating_cat_exit.py',
                                'tests/ui/main_window/test_ui_main_window_carrier_match.py',
                                'tests/ui/main_window/test_ui_main_window_layout.py',
                                'tests/ui/main_window/test_ui_main_window_load_driver_carrier.py',
                                'tests/ui/main_window/test_ui_main_window_save_organizations.py',
                                'tests/ui/main_window/test_ui_theme.py',
                                'tests/ui/main_window/test_vehicle_recognition_list.py')
            'tabs'          = @('tests/ui/tabs')
            'widgets'       = @('tests/ui/widgets')
            'windows'       = @('tests/ui/windows')
          }
          $failed = 0
          foreach ($part in $parts.Keys) {
            Write-Output "=== $part ==="
            python -m pytest @($parts[$part]) -o addopts="" -v -rf --tb=line `
              --basetemp="tests/_tmp/_ci_$part" `
              --junitxml="tests/_tmp/junit-ui-$part.xml" 2>&1 |
              Tee-Object -FilePath "tests/_tmp/ui-$part-output.txt"
            $code = $LASTEXITCODE
            Write-Output "pytest (${part}) вернул: $code"
            if ($code -ne 0) { $failed = 1 }
          }
          exit $failed

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          foreach ($part in @('agent_widget', 'main_window_a', 'main_window_b',
                              'tabs', 'widgets', 'windows')) {
            . ./.ci/publish_failures.ps1 -Layer "ui-$part"
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui
          # Частей пять (по папкам) — отчётов тоже пять.
          path: tests/_tmp/junit-ui-*.xml
          if-no-files-found: ignore

  lint:
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
