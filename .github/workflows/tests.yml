# CI: прогон тестов по слоям на каждый push в main и на pull request.
#
# Почему по слоям, а не одним процессом: на машине оператора полный набор в
# одном процессе роняет pytest с 0xC0000409 (свойство окружения — PyQt5 на
# Python 3.14). После Этапа 7 слои запускаются раздельно и не требуют деления
# на части: `tests/ui/` (1687 тестов) проходит одним процессом.
#
# python-version: 3.14 доступен в actions/python-versions (есть 3.14.4 и
# новее для win32-x64), поэтому стоит 3.14. Если когда-нибудь станет
# недоступен — замена одна строка: '3.12' (проект совместим).
#
# Слои идут ВСЕ и целиком: список «известных отказов» (`.ci/known_failures.txt`)
# больше не нужен — оба оставшихся теста читали РАБОЧИЙ `config/settings.json`
# и теперь честно пропускаются, когда файла нет (он локальный, у каждого
# оператора свой; в репозитории лежит только образец `settings.example.json`).
# Файл удалён вместе со ссылками на него здесь — как и было записано в его
# шапке.
#
# ─────────────────────────────────────────────────────────────
# ПОЧЕМУ ОТКАЗЫ ПЕЧАТАЮТСЯ АННОТАЦИЯМИ (шаг «Publish failures»)
# ─────────────────────────────────────────────────────────────
# Логи GitHub Actions отдаёт ТОЛЬКО владельцу репозитория: `/actions/jobs/
# <id>/logs` отвечает 403 без входа, артефакты — 401. А вот аннотации
# check-run читаются публично:
#     https://api.github.com/repos/<owner>/<repo>/check-runs/<job_id>/annotations
# Поэтому имена упавших тестов, итоговая строка pytest и размер отчёта
# печатаются workflow-командами `::error::` (`.ci/publish_failures.ps1`) —
# GitHub превращает их в аннотации. Шаг выполняется ВСЕГДА (`if: always()`)
# и никогда не роняет работу.
#
# Что НЕ делается в CI:
#   * приватная часть (`logistics_contractor_private`) — отдельный
#     репозиторий, в публичном CI её нет; тесты с маркером `needs_private`
#     в этих слоях не собираются;
#   * Tesseract OCR не ставится: тесты офлайн-OCR при его отсутствии
#     пропускаются (`skip`), а не падают;
#   * `config/settings.json` не создаётся: файл локальный и в репозитории
#     его нет намеренно — есть `settings.example.json`. Тесты, которые
#     читают рабочий файл, пропускаются по `skipif`;
#   * два теста сверки с рабочей `contracts.db` в CI не падают, а
#     пропускаются: в свежем checkout базы оператора нет.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  #: Qt без экрана: UI-тесты идут в offscreen-режиме во всех слоях.
  QT_QPA_PLATFORM: offscreen

jobs:
  test-unit:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest tests/unit/ -o addopts="" -q -rf --tb=line --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-unit.xml 2>&1 |
            Tee-Object -FilePath tests/_tmp/unit-output.txt
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          . ./.ci/publish_failures.ps1 -Layer unit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: tests/_tmp/junit-unit.xml
          if-no-files-found: ignore

  test-integration:
    name: Integration tests
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        shell: pwsh
        run: |
          python -m pytest tests/integration/ -o addopts="" -q -rf --tb=line --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-integration.xml 2>&1 |
            Tee-Object -FilePath tests/_tmp/integration-output.txt
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          . ./.ci/publish_failures.ps1 -Layer integration

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: tests/_tmp/junit-integration.xml
          if-no-files-found: ignore

  test-ui:
    name: UI tests (offscreen)
    runs-on: windows-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        shell: pwsh
        run: |
          python -m pytest tests/ui/ -o addopts="" -q -rf --tb=line --basetemp=tests/_tmp/_ci `
            --junitxml=tests/_tmp/junit-ui.xml 2>&1 |
            Tee-Object -FilePath tests/_tmp/ui-output.txt
          $code = $LASTEXITCODE
          Write-Output "pytest вернул: $code"
          exit $code

      - name: Publish failures
        if: always()
        shell: pwsh
        run: |
          . ./.ci/publish_failures.ps1 -Layer ui

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui
          path: tests/_tmp/junit-ui.xml
          if-no-files-found: ignore

  lint:
    name: Ruff
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
